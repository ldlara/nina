# Projeto Xcode gerado por XcodeGen (https://github.com/yonaskolb/XcodeGen). NÃO versione o .xcodeproj.
#   cd ios && xcodegen generate && open Nina.xcodeproj
name: Nina

options:
  bundleIdPrefix: app.nina
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Preencha com o seu Team ID (necessário para dispositivo e Sign in with Apple). Simulador roda sem.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES

packages:
  NinaCore:
    path: Packages/NinaCore

targets:
  Nina:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Nina
        excludes:
          - Info.plist
          - Nina.entitlements
    dependencies:
      - package: NinaCore
        product: NinaCore
    info:
      path: App/Nina/Info.plist
      properties:
        CFBundleDisplayName: Nina
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NinaAPIBaseURL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: app.nina.invite
            CFBundleURLSchemes: [nina]
    entitlements:
      path: App/Nina/Nina.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nina.Nina
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Domínio é placeholder no contrato (openapi.yaml servers). Troque para o BFF real.
        API_BASE_URL: "https:/$()/api.staging.nina.app/v1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          API_BASE_URL: "https:/$()/api.nina.app/v1"

  NinaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/NinaTests
    dependencies:
      - target: Nina
      - package: NinaCore
        product: NinaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nina.NinaTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nina:
    build:
      targets:
        Nina: all
        NinaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NinaTests
    profile:
      config: Release
    archive:
      config: Release
