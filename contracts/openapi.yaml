                      base_version: 1
                      client_created_at: '2026-10-08T18:10:00Z'
      responses:
        '200':
          description: Resultado por mutação, na mesma ordem do pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
              examples:
                mixed:
                  value:
                    server_time: '2026-10-08T18:10:03Z'
                    results:
                      - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e01
                        status: APPLIED
                        entity_type: SLEEP_SESSION
                        entity_id: 0b8f1a52-6f3e-4a0c-8f86-6c3d7a3c1a10
                        version: 1
                        resolution: NONE
                      - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e02
                        status: DUPLICATE
                        entity_type: SLEEP_SESSION
                        entity_id: 0b8f1a52-6f3e-4a0c-8f86-6c3d7a3c1a10
                        version: 2
                        resolution: NONE
                      - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e04
                        status: REJECTED
                        entity_type: DIAPER_EVENT
                        entity_id: 5e2f0b1a-3c4d-4e5f-9a6b-7c8d9e0f1a2b
                        retryable: false
                        problem:
                          type: https://api.nina.app/problems/entity-deleted
