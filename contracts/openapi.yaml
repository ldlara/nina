  # ------------------------------------------------------------------- SYNC
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushMutations
      summary: Enviar mutações do cliente (idempotente)
      description: |
        Único caminho de escrita de eventos de tracking (criar, editar, excluir). Até 100 mutações por
        requisição, processadas **em ordem**. Cada uma é idempotente por `mutation_id`: reenvio devolve
        `status=DUPLICATE` com o estado canônico, sem duplicar efeito (RF-046-A3, INV-18).

        O resultado é **por mutação**; falha de uma não impede as demais. A requisição só falha inteira
        em `401`, `429`, `413`, `400` (envelope inválido) ou `426`.

        Regras: `base_version` é a versão do servidor que o cliente conhecia (0 em criação). Edições
        concorrentes são resolvidas por last-write-wins por campo e auditadas (`resolution`, `conflicts`).
        Update sobre tombstone **não ressuscita** (`REJECTED`, `ENTITY_DELETED`). `device_id` deve ser o da
        sessão.

        **Ordem definida pelo servidor (SR-014):** o "último" a escrever é decidido pela ordem de chegada ao servidor
        (`server_received_at` e a sequência interna `sync_sequence`, atribuída no commit), **nunca** pelo relógio do
        cliente. `client_created_at` é **somente informativo** (auditoria, exibição e diagnóstico de relógio); é
        preservado como veio e não influencia a resolução. Por isso `LWW_CLIENT_WON` significa "a mutação recebida
        agora venceu" e `LWW_SERVER_WON` "o valor já aplicado permaneceu" (em ordem de chegada). Se
        `|client_created_at - server_received_at|` excede `limits.sync_max_clock_skew_seconds` (padrão 86400),
        a mutação é aplicada normalmente e a resposta traz `warnings[CLIENT_CLOCK_SKEW]` com `skew_seconds`; o
        cliente deve avisar o usuário para corrigir o relógio. Cada resultado devolve `server_received_at`.

        **Validação cruzada de `baby_id` e `entity_id` (SR-014):** em toda mutação o servidor verifica o vínculo ativo
        do usuário com `baby_id` **e** que `entity_id` pertence a esse `baby_id` (e, em `WAKE_EVENT`, que
        `sleep_session_id` é do mesmo bebê). `UPDATE`/`DELETE` com `entity_id` inexistente **ou de outro bebê**
        resulta em `REJECTED` com `problem.code=ENTITY_NOT_FOUND`, `retryable=false`, sem distinguir os dois casos
        (não revela existência). `CREATE` com `entity_id` já usado por outro bebê ou outro usuário resulta em
        `REJECTED` com `problem.code=ENTITY_ID_UNAVAILABLE`, `retryable=false` (o cliente gera novo UUID); o
        `mutation_id` é escopado por usuário e dispositivo, de modo que um UUID de outro usuário nunca causa colisão
        nem queima o identificador alheio. O cursor de `/sync/pull` é assinado e vinculado a um único `baby_id`.

        **Cotas e limites de lote (SEC-042):** no máximo `limits.sync_max_mutations_per_push` (100) mutações e
        `limits.sync_max_payload_bytes` (262144 = 256 KiB) por requisição (`413 PAYLOAD_TOO_LARGE`); cota diária por
        bebê `limits.sync_max_events_per_baby_per_day` e teto de entidades vivas por bebê
        `limits.sync_max_entities_per_baby`. Excedida a cota diária, a requisição inteira recebe
        `429 QUOTA_EXCEEDED` com `Retry-After`; excedido o teto de entidades, a mutação `CREATE` sai `REJECTED` com
        `problem.code=ENTITY_QUOTA_EXCEEDED` e `retryable=false`. Os valores ausentes de `/reference-data` indicam
        que o servidor não os publica (aplica o padrão interno).

        **Sono sobreposto (ADR-0009, decisão 5):** governado pela flag `sleep_overlap_policy`
        (`GET /reference-data` -> `policies`). Padrão `ACCEPT_AND_WARN`: a mutação é `APPLIED` com
        `resolution=KEPT_BOTH` e `warnings[SLEEP_OVERLAP]`. Com `REJECT`: a mutação é `REJECTED`,
        `problem.code=SLEEP_OVERLAP`, `retryable=false`, sem alterar estado.

        **Entidades:** `SLEEP_SESSION`, `FEEDING_SESSION`, `PUMPING_SESSION`, `DIAPER_EVENT` e `WAKE_EVENT`
        (despertar, ADR-0009). Excluir uma `SLEEP_SESSION` gera tombstone também dos seus `WAKE_EVENT`.
        Mamada `BREASTFEEDING` exige `end_at` (PA-05 resolvido, ADR-0010; o timer vive só no cliente até parar).
      x-rf: [RF-046, RF-047, RF-008, RF-009, RF-015, RF-016, RF-017, RF-018, RF-020]
      x-roles: [Owner, Caregiver]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
            examples:
              sleepTimerStartThenStop:
                summary: Iniciar e parar soneca offline, mais uma fralda
                value:
                  device_id: 6f1d1c5e-4a3b-4f0e-9a52-0b5b3c8a7e11
                  mutations:
                    - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e01
                      op: CREATE
                      entity_type: SLEEP_SESSION
                      entity_id: 0b8f1a52-6f3e-4a0c-8f86-6c3d7a3c1a10
                      baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                      base_version: 0
                      client_created_at: '2026-10-08T17:00:02Z'
                      data:
                        sleep_type: NAP
                        start_at: '2026-10-08T17:00:00Z'
                        end_at: null
                        tz: America/Sao_Paulo
                        source: TIMER
                    - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e02
                      op: UPDATE
                      entity_type: SLEEP_SESSION
                      entity_id: 0b8f1a52-6f3e-4a0c-8f86-6c3d7a3c1a10
                      baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                      base_version: 1
                      client_created_at: '2026-10-08T17:48:05Z'
                      data:
                        end_at: '2026-10-08T17:48:00Z'
                    - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e03
                      op: CREATE
                      entity_type: DIAPER_EVENT
                      entity_id: 5e2f0b1a-3c4d-4e5f-9a6b-7c8d9e0f1a2b
                      baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                      base_version: 0
                      client_created_at: '2026-10-08T17:55:00Z'
                      data:
                        occurred_at: '2026-10-08T17:54:00Z'
                        tz: America/Sao_Paulo
                        diaper_type: WET
              deleteEvent:
                summary: Excluir evento
                value:
                  device_id: 6f1d1c5e-4a3b-4f0e-9a52-0b5b3c8a7e11
                  mutations:
                    - mutation_id: 9c1d2e3f-0a1b-4c2d-8e3f-1a2b3c4d5e04
                      op: DELETE
