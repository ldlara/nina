        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullChanges
      summary: Obter mudanças do bebê por cursor opaco
      description: |
        **Sem `cursor`**: snapshot completo (todas as entidades vivas do bebê, paginado). O servidor fixa o
        ponto de consistência na primeira página, de modo que o último `next_cursor` do snapshot continua em delta.
        **Com `cursor`**: delta, apenas mudanças posteriores, incluindo **tombstones** (`op=TOMBSTONE`).

        Entidades do feed: `BABY`, `SLEEP_SESSION`, `FEEDING_SESSION`, `PUMPING_SESSION`, `DIAPER_EVENT`,
        `WAKE_EVENT` (despertares, ADR-0009), `SLEEP_PREFERENCES` e `SLEEP_PREDICTION`. Um `WAKE_EVENT` removido
        (ou removido em cascata com sua `SLEEP_SESSION`) chega como `TOMBSTONE`.

        O cursor é **opaco**: o cliente só o guarda e o devolve, nunca interpreta nem compara. Aplicação das
        mudanças é idempotente e ordenada por `version` por entidade; se `has_more=true`, continuar com `next_cursor`.

        **Cursor expirado (> 90 dias, janela de tombstones, ADR-0003) ou inválido** responde `410 SYNC_CURSOR_EXPIRED`
        com `resync_required=true`: o cliente descarta o estado sincronizado do bebê, **preserva a fila de mutações
        pendentes**, refaz o pull sem cursor e reenvia as pendentes. Vínculo revogado: `403 ACCESS_REVOKED`
        (o cliente apaga os dados locais do bebê).
      x-rf: [RF-007, RF-046, RF-047, RF-019]
      x-roles: [Owner, Caregiver, ReadOnly]
      parameters:
        - name: baby_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: Cursor opaco devolvido por uma resposta anterior. Omitir para snapshot.
          schema: { $ref: '#/components/schemas/SyncCursor' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Página de mudanças.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullResponse' }
              examples:
                delta:
                  value:
                    mode: DELTA
                    baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                    server_time: '2026-10-08T18:10:03Z'
                    has_more: false
                    next_cursor: eyJ2IjoxLCJwIjoiYWJjIn0.q8Zx
                    changes:
                      - op: UPSERT
                        entity_type: DIAPER_EVENT
                        entity_id: 5e2f0b1a-3c4d-4e5f-9a6b-7c8d9e0f1a2b
                        version: 1
                        entity:
                          event_type: DIAPER
                          id: 5e2f0b1a-3c4d-4e5f-9a6b-7c8d9e0f1a2b
                          baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                          version: 1
                          tz: America/Sao_Paulo
                          created_at: '2026-10-08T17:55:01Z'
                          updated_at: '2026-10-08T17:55:01Z'
                          created_by: { id: 3c1c0d0e-5b61-4d6e-8a3a-0a0c5d1d9f01, display_name: Ana }
                          last_modified_by: { id: 3c1c0d0e-5b61-4d6e-8a3a-0a0c5d1d9f01, display_name: Ana }
                          occurred_at: '2026-10-08T17:54:00Z'
                          diaper_type: WET
                      - op: TOMBSTONE
                        entity_type: SLEEP_SESSION
                        entity_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                        version: 4
                        deleted_at: '2026-10-08T18:00:00Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/CursorExpired' }
