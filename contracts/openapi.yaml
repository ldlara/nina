  # ---------------------------------------------------------- SUBSCRIPTIONS
  /me/entitlements:
    get:
      tags: [Subscriptions]
      operationId: getEntitlements
      summary: Entitlement efetivo e feature flags
      description: |
        Calculado no servidor (RB-009); o cliente nunca decide. Toda funcionalidade que possa ser premium
        tem um gate bloqueado por padrão, liberado por flags no banco (ADR-0005). O app guarda em cache até
        `cache_expires_at` para uso offline (D-31). Recursos desconhecidos pelo cliente devem ser tratados como bloqueados.
      x-rf: [RF-041, RF-043]
      x-roles: [Any]
      responses:
        '200':
          description: Entitlement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
              examples:
                free:
                  value:
                    plan: FREE
                    status: NONE
                    source: NONE
                    valid_until: null
                    fetched_at: '2026-10-08T18:00:00Z'
                    cache_expires_at: '2026-10-09T18:00:00Z'
                    features:
                      - { key: tracking.basic, enabled: true }
                      - { key: charts.month, enabled: false, reason: PREMIUM_REQUIRED }
                    seats: null
        '401': { $ref: '#/components/responses/Unauthorized' }
  /subscriptions/purchases:
    post:
      tags: [Subscriptions]
      operationId: submitPurchase
      summary: Enviar compra da loja para validação
      description: |
        O backend valida com Apple/Google e só então ativa o entitlement (RF-042-A1). Recibo inválido, adulterado
        ou vinculado a outra conta: `409 PURCHASE_CONFLICT` sem conceder nada. Compra pendente (aprovação familiar
        da loja): `202` com `status=PENDING`. Idempotente por `Idempotency-Key` e por transação.
      x-rf: [RF-041, RF-042]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '200':
          description: Compra validada; entitlement vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '202':
          description: Validação pendente; o cliente consulta `/me/entitlements`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReuse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /subscriptions/restore:
    post:
      tags: [Subscriptions]
      operationId: restorePurchases
      summary: Restaurar compras em novo dispositivo
      description: Reaproveita a Subscription existente sem nova cobrança (INV-26). Uma compra de loja não vincula duas contas (RF-042-A6).
      x-rf: [RF-042]
      x-roles: [Any]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Entitlement após restauração.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /subscriptions/family-seat:
    put:
      tags: [Subscriptions]
      operationId: assignFamilySeat
      summary: Atribuir o assento premium a um cuidador (PROPOSTA)
      description: |
        **Proposta sujeita a D-04/ADR-0005.** Plano premium por família: titular + 1 membro adicional.
        Por ADR-0009 (decisão 7) o **adicional não precisa ser cuidador ativo do bebê**: o Owner informa um
        `membership_id` de cuidador existente **ou** um `email` (a pessoa recebe o assento ao entrar/cadastrar-se
        com esse e-mail verificado, sem vínculo com bebê). Informar exatamente um dos dois. Revogar ou remover
        um cuidador **não** remove o assento; só `DELETE /subscriptions/family-seat` (ou o fim da assinatura) o faz.
      x-rf: [RF-043]
      x-roles: [Owner]
      x-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exatamente um entre `membership_id` e `email`.
              properties:
                membership_id:
                  type: string
                  format: uuid
                  description: Cuidador existente (opcional; o adicional pode não ser cuidador).
                email:
                  type: string
                  format: email
                  description: E-mail do adicional, que não precisa ser cuidador de nenhum bebê.
              oneOf:
                - required: [membership_id]
                - required: [email]
              additionalProperties: false
      responses:
        '200':
          description: Assento atribuído.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Subscriptions]
      operationId: releaseFamilySeat
      summary: Liberar o assento premium (PROPOSTA)
      x-rf: [RF-043]
      x-roles: [Owner]
      x-status: proposed
      responses:
        '204': { description: Assento liberado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

