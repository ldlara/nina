        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- CHARTS
  /babies/{baby_id}/aggregates:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    get:
      tags: [Charts]
      operationId: getAggregates
      summary: Agregações para gráficos de sono, alimentação, fralda e pumping
      description: |
        Por `period`: `DAY` (buckets por hora), `WEEK` e `MONTH` (buckets por dia), ancorado em `anchor_date`
        (data civil no fuso do bebê; padrão: hoje). Inclui média do período e comparação **somente com o
        período anterior do mesmo bebê** (RB-013); nunca ranking nem percentil. Período sem dado: `buckets`
        vazios e `data_sufficiency.sufficient=false`, não zeros enganosos (RF-028-A2). Alvo p95 < 500 ms.
        Atribuição de sessões que cruzam a meia-noite segue D-13.

        `night_awakenings` e `night_awakenings_avg` são **derivados** dos `WakeEvent` (nunca gravados):
        `null` = dados insuficientes (acompanhamento abaixo do critério de `/reference-data`
        `limits.night_awakenings_min_session_minutes`); `0` = acompanhamento suficiente e nenhum despertar;
        `N>0` = quantidade de despertares.
      x-rf: [RF-028, RF-029, RF-010]
      x-roles: [Owner, Caregiver, ReadOnly]
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [DAY, WEEK, MONTH] }
        - name: anchor_date
          in: query
          schema: { type: string, format: date }
        - name: include
          in: query
          description: Domínios desejados; padrão todos.
          schema:
            type: array
            items: { type: string, enum: [SLEEP, FEEDING, PUMPING, DIAPERS] }
          style: form
          explode: false
      responses:
        '200':
          description: Agregações.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregatesResponse' }
              examples:
                week:
                  value:
                    baby_id: 7d0a5c9e-1c0b-4d3a-b5f4-2f9d0e6a8b21
                    period: WEEK
                    range: { from: '2026-10-05', to: '2026-10-11' }
                    tz: America/Sao_Paulo
                    granularity: DAY
                    generated_at: '2026-10-08T18:00:00Z'
                    buckets:
                      - local_date: '2026-10-05'
                        start_at: '2026-10-05T03:00:00Z'
                        sleep: { total_minutes: 820, night_minutes: 610, nap_minutes: 210, nap_count: 3, night_awakenings: 2 }
                        feeding: { breast_count: 4, breast_minutes: 62, bottle_count: 3, bottle_volume_ml: 450 }
                        pumping: { count: 0, minutes: 0, volume_ml: 0 }
                        diapers: { count: 6, by_type: { WET: 4, DIRTY: 2 } }
                    summary: { days_counted: 3, sleep_total_minutes_avg: 805, nap_count_avg: 3, night_awakenings_avg: 1.5, feeding_count_avg: 7, diaper_count_avg: 6 }
                    comparison:
                      kind: OWN_HISTORY
                      previous_range: { from: '2026-09-28', to: '2026-10-04' }
                      deltas: { sleep_total_minutes_avg: 15, nap_count_avg: -1 }
                    data_sufficiency: { sufficient: true, days_with_data: 3, min_days_required: 3 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- NOTIFICATIONS
  /babies/{baby_id}/notification-preferences:
    parameters:
