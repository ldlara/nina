        Acrescenta um ConsentRecord (append-only). Revogar `analytics_product` interrompe o envio imediatamente (RF-040-A3).
        Finalidades opcionais são separadas do aceite de Termos (RF-003-A5). Gera AuditEvent.
      x-rf: [RF-003, RF-040, RF-055]
      x-roles: [Any]
