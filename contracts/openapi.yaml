    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      summary: Salvar preferências de notificação
      description: |
        Substitui o conjunto das categorias enviadas. Mudanças recalculam/cancelam jobs agendados (INV-24).
        `DEVELOPMENT_PHASE` é aceita mas não gera envio no MVP (D-10). Quiet hours cruzando a meia-noite são válidas.
      x-rf: [RF-037, RF-038, RF-040]
