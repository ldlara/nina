openapi: 3.1.0
info:
  title: Nina BFF API
  version: 1.0.1
  summary: API do BFF consumida pelos apps iOS e Android do Nina (MVP).
  description: |
    Contrato da API do BFF (ADR-0002) para os apps móveis. **Versão 1.0.1 (congelada para o MVP; patch de
    segurança SR-013..SR-016, SR-020, SR-021 da `specs/security-review-001.md`, sem quebra)**, conforme
    ADR-0009 e ADR-0010. Mudanças seguem as regras da seção "Congelamento v1" de `specs/api-spec.md`: aditivas
    são permitidas; qualquer quebra exige `/v2`. Pontos ainda abertos e itens que exigem decisão ou `/v2`
    estão listados na mesma seção.

    ## Convenções
    - **Versionamento:** prefixo de caminho `/v1`. Mudanças aditivas (campos novos, enums novos
      tolerados) não mudam a versão; clientes ignoram campos desconhecidos. Quebras criam `/v2`.
      Descontinuação anunciada pelos cabeçalhos `Deprecation` e `Sunset`.
    - **Autenticação:** `Authorization: Bearer <access_token>` (JWT com o perfil de segurança descrito abaixo, até 15 min). Refresh
      token opaco, rotativo e de uso único (SEC-011).
    - **Erros:** RFC 7807 (`application/problem+json`) com `code` estável e `errors[]` por campo.
      O cliente localiza a mensagem a partir de `code` (RF-050-A5); `title`/`detail` não são
      para exibição direta.
    - **Datas:** instantes em UTC (RFC 3339, sufixo `Z`); fuso contextual em `tz` (IANA);
      datas civis `YYYY-MM-DD`; horas locais `HH:MM`. Unidade de volume: sempre `ml`.
    - **Idempotência:** `POST` não-sync que cria efeito colateral aceita `Idempotency-Key`.
      O sync é idempotente por `mutation_id`.
    - **Paginação:** listas usam `limit` + `page_token` opaco. O feed de sync usa `cursor` opaco
      (outro mecanismo, ver `/sync/pull`).
    - **Autorização:** por bebê e papel (Owner, Caregiver, ReadOnly), sempre no servidor. Quem não
      tem vínculo recebe `404` uniforme; quem tem vínculo sem papel suficiente recebe `403`;
      vínculo revogado recebe `403` com `code=ACCESS_REVOKED`.
    - **Saúde:** previsões e tendências são orientação, não diagnóstico (RNF-014); a API devolve
      chaves de texto e o cliente localiza o aviso.
    - **Convenção de nulos e vazios (ADR-0009):** `null` = *não se aplica* ou *indisponível/desconhecido*
      (cada campo documenta qual dos dois, quando o contexto os distingue). `0` = valor conhecido igual a zero;
      nunca se usa `0` para "não informado". Em enums, `UNSPECIFIED` = o usuário deliberadamente não especificou;
      `UNKNOWN` = deveria existir mas o sistema não sabe (ex.: migração de dados antigos; reservado, o cliente
      não o envia).
    - **Enums em MAIÚSCULAS (ADR-0010):** **todos** os valores de enum do contrato são em maiúsculas
      (`NAP`, `FEMALE`, `TIMER`, `OWNER`, `ACTIVE`, `APPLIED`, `WEEK`...), tanto em requisições quanto em respostas,
      parâmetros de consulta e exemplos. Chaves de objeto, nomes de campo e chaves de mensagem (`explanation.key`,
      `disclaimer_key`, `feature.key`) não são enums e permanecem em `snake_case`/minúsculas.
    - **Tolerância a valores desconhecidos (ADR-0009/0010):** qualquer enum pode ganhar valores em mudança aditiva
      (sem nova versão). O cliente **deve tolerar valores desconhecidos** em respostas (exibir como "outro"/genérico
      ou ignorar a entrada, nunca falhar nem descartar o registro). `DiaperType`, `FeedingType` e `MilkType` são
      marcados `x-extensible-enum` e têm os valores vigentes em `/reference-data`. O servidor rejeita valor
      desconhecido **na entrada** com `400 VALIDATION_FAILED`.
    - **Nomes de campo (ADR-0010):** `snake_case` em todo o contrato (confirmado; ex.: `age_calculation`,
      `chronological_days`, `night_awakenings`).
    - **Cadastro e escrita de eventos (ADR-0009):** a conta só fica ativa após confirmação de e-mail (a sessão
      nasce em `POST /auth/email/verify`). Eventos de tracking são escritos **somente** por `POST /sync/push`
      (online = lote de 1 mutação); não há `POST/PATCH/DELETE` de eventos.
    - **Políticas por flag (ADR-0005/0009/0010):** o comportamento de sono sobreposto (`ACCEPT_AND_WARN` | `REJECT`),
      a política de exclusão de conta (`CASCADE` | `BLOCK` | `TRANSFER_OWNERSHIP`), a janela de arrependimento da
      exclusão (`deletion_grace_days`, padrão 7), a janela da idade corrigida (`corrected_age_max_months`, padrão 24)
      e os prazos de atendimento de privacidade são configuração em banco, expostos em `GET /reference-data`
      (`policies`). O mesmo vale para `limits.night_awakenings_min_session_minutes` (padrão 240). Os valores acima
      são **padrões iniciais, customizáveis em banco**; o cliente não decide, apenas reflete o valor vigente.
    - **Exclusão de conta e direitos do titular (ADR-0010):** só o **Owner ativo de um bebê** solicita a exclusão da
      conta (`/me/deletion-request`; `403 FORBIDDEN_ROLE` para os demais). Quem não é Owner exerce acesso, correção,
      exportação e eliminação/anonimização dos **próprios dados pessoais** em `/me/privacy-requests`, sem apagar os
      dados do bebê. Ambos exigem reautenticação (`X-Reauth-Token`).
    - **Mamada (ADR-0010):** `end_at` é obrigatório em `BREASTFEEDING` (PA-05 resolvido).

    ## Segurança (v1.0.1, SR-013 a SR-021; somente esclarecimentos e restrições compatíveis)
    - **Limite de taxa (SEC-040):** **todas** as operações podem responder `429` com o cabeçalho `Retry-After`
      (segundos) e o `Problem` `RATE_LIMITED` (taxa por IP, conta e dispositivo) ou `QUOTA_EXCEEDED` (cota de volume,
      por exemplo `limits.sync_max_events_per_baby_per_day`). O cliente respeita `Retry-After` com atraso
      exponencial e *jitter*; nunca reenvia em laço apertado. Login, cadastro, verificação, recuperação,
      reautenticação, convites, exportação e sync têm limites mais baixos; valores são configuração do servidor e
      podem ser consultados em `GET /reference-data` -> `limits` quando publicados.
    - **Tamanhos e formatos de entrada (SEC-043):** toda string livre ou credencial de **requisição** tem
      `maxLength` (senha 128; códigos 6 a 12 dígitos; tokens opacos até 512; `id_token` até 4096; `nonce` 256;
      e-mail 254; `timezone` e `tz` 64; `locale` 35). Objetos de credencial rejeitam campos desconhecidos
      (`additionalProperties: false`). Violação: `400 VALIDATION_FAILED` com `errors[]`.
    - **Perfil do JWT de acesso (SEC-011, SR-013.4):** o cliente trata o access token como **opaco**. O servidor
      emite e valida assim: assinatura assimétrica com algoritmo **fixado na configuração** (`EdDSA` com Ed25519, ou
      `ES256`; `none`, `HS*` e `RS256` são recusados e o `alg` do cabeçalho do token nunca é confiado), cabeçalho
      `typ=at+jwt` e `kid` obrigatório; claims `iss` (`https://api.nina.app`), `aud` (`nina-api`), `sub` (id do
      usuário), `sid` (id da sessão), `jti`, `iat`, `nbf` e `exp` (`exp - iat <= 900 s`); tolerância de relógio de no
      máximo 60 s. A cada requisição o servidor confere que a sessão (`sid`) não foi revogada e que o vínculo com o bebê
      está ativo; **papel e permissões nunca vêm do token**. Rotação de chaves: a nova chave (`kid`) é publicada para os
      verificadores internos antes de assinar, e a chave anterior continua válida para verificação por pelo menos
      `exp` máximo + tolerância; chave comprometida é retirada imediatamente (os tokens afetados expiram em até
      15 min ou caem por revogação de sessão). Os tokens de reautenticação seguem o mesmo perfil, com `typ=reauth+jwt`
      e `aud=nina-reauth`.
    - **Reautenticação (SR-013.1):** ver `POST /auth/reauthenticate` e o cabeçalho `X-Reauth-Token`. O token é
      vinculado a `sub` e `sid`, a um `scope` por operação sensível, tem `jti` de **uso único** e validade de no
      máximo 300 s.
    - **Recuperação de senha (SEC-017):** `POST /auth/password/reset` invalida **todas** as sessões e **todos** os
      refresh tokens do usuário (todas as famílias) e quaisquer tokens de reautenticação em circulação.
    - **Códigos de verificação (SEC-014):** códigos de e-mail (`/auth/email/verify`, `/me/email-changes/confirm`)
      são numéricos de 6 a 12 dígitos (alvo de emissão: 8 dígitos), de uso único, com validade máxima de 15 minutos
      (alvo 10), no máximo 5 tentativas por código (depois disso o código é invalidado) e limite de taxa por
      conta e por IP.
    - **Sync, ordem e conflito (SR-014):** a **ordem é definida pelo servidor** (`server_received_at` e a sequência
      interna `sync_sequence`); `client_created_at` é **somente informativo** e nunca decide quem vence um conflito.
      Detalhes e cotas em `POST /sync/push`.
    - **Dados mínimos (SR-015):** o campo `Baby.sex` é opcional, **depreciado** e o app **não deve coletá-lo nem
      enviá-lo** (privacy-security-spec 1.3: "Não coletar"). `Session.approx_location` é reservado e o servidor não o
      preenche no MVP (sem geolocalização por IP).
    - **Exclusão em cascata (SR-016):** antes e depois de excluir um bebê compartilhado (por exclusão de conta do
      Owner ou por `DELETE /babies/{id}`), o servidor notifica por e-mail e push (categoria `SYSTEM`, não
      desativável) o titular e todos os cuidadores ativos. Ver `AccountDeletion.caregivers_notification`.
    - **Superfície operacional (SR-020):** `/health` e `/ready` **não fazem parte** deste contrato nem são expostos
      pela rota pública; são internos à plataforma e não listam módulos nem dependências.
    - **Alinhamento com o banco (SR-021):** `PurposeKey` trafega em MAIÚSCULAS no contrato (`TERMS_OF_USE`); o servidor
      converte para a chave minúscula do banco (`terms_of_use`) na fronteira, de forma bijetora, e valida contra o
      catálogo. O banco é a fonte dos limites efetivos; este contrato nunca é mais frouxo que o banco.
  contact:
    name: Time Nina (API)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.nina.app/v1
    description: Produção (placeholder, domínio a confirmar)
  - url: https://api.staging.nina.app/v1
    description: Homologação (placeholder)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Cadastro, login (e-mail/senha, Google, Apple), refresh, logout e recuperação de acesso.
  - name: Account
    description: Perfil do usuário, identidades vinculadas, sessões e dispositivos, tokens de push.
  - name: Babies
    description: Perfis de bebê.
  - name: Caregivers
    description: Cuidadores, convites e papéis.
  - name: Tracking
    description: Leitura de eventos (sono, mamada, mamadeira, fralda, pumping) e timeline. Escrita via Sync. Despertares (`WakeEvent`) trafegam só no Sync.
  - name: Sync
    description: Push idempotente de mutações e pull incremental por cursor opaco.
  - name: Sleep
    description: Previsão de sono e preferências de rotina.
  - name: Charts
    description: Agregações e comparações com o próprio histórico.
  - name: Notifications
    description: Preferências de notificação por bebê.
  - name: Subscriptions
    description: Entitlement, feature flags, compras e restauração.
  - name: Privacy
    description: Consentimentos, exportação, exclusão de conta (Owner), requisições de privacidade (demais titulares) e auditoria.
  - name: Reference
    description: Dados de referência e parâmetros configuráveis.

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerWithEmail
      summary: Cadastrar conta com e-mail e senha
      description: |
        Resposta **uniforme** (`202`) exista ou não o e-mail, para impedir enumeração (RF-001-A2).
        Um código de verificação é enviado ao e-mail; **a conta só fica ativa após a confirmação por e-mail** e a
        sessão só é emitida em `/auth/email/verify` (ADR-0009, decisão 1).
        Aceite de Termos e Política é obrigatório (RF-003-A1).
      security: []
      x-rf: [RF-001, RF-003]
      x-roles: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              default:
                value:
                  email: ana@example.org
                  password: correct-horse-battery-staple
                  display_name: Ana
                  locale: pt-BR
                  timezone: America/Sao_Paulo
                  consents:
                    - { purpose_key: TERMS_OF_USE, document_version: 1.0.0 }
                    - { purpose_key: PRIVACY_POLICY, document_version: 1.0.0 }
      responses:
        '202':
          description: Verificação enviada (resposta idêntica para e-mail novo ou existente).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPending' }
              examples:
                default: { value: { status: VERIFICATION_PENDING, resend_after_seconds: 60 } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirmar e-mail e abrir a primeira sessão
      description: |
        Ativa a conta (ADR-0009) e emite a primeira sessão. Antes disso não existe sessão nem conta ativa.
        Política do código (SR-013.5): numérico de 6 a 12 dígitos (emissão alvo de 8), uso único, validade máxima de
        15 minutos (alvo 10), no máximo 5 tentativas por código (esgotadas, o código é invalidado e é preciso pedir
        outro) e limite de taxa por e-mail e por IP. Código errado, expirado ou esgotado: `401`
        (`INVALID_VERIFICATION_CODE`), sempre com a mesma resposta.
      security: []
      x-rf: [RF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerifyRequest' }
      responses:
        '200':
          description: Sessão emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Login com e-mail e senha
      description: |
        Credenciais inválidas retornam erro genérico (`INVALID_CREDENTIALS`), sem revelar se a conta existe (resposta e
        tempo equivalentes). Após N falhas por conta, IP ou dispositivo (D-16) aplica-se limite de taxa progressivo:
        `429 RATE_LIMITED` com `Retry-After` crescente (SEC-041). Login em dispositivo novo gera aviso de segurança por
        e-mail ao titular. `password` aceita até 128 caracteres (SR-013).
      security: []
      x-rf: [RF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              default:
                value:
                  email: ana@example.org
                  password: correct-horse-battery-staple
                  device:
                    device_id: 6f1d1c5e-4a3b-4f0e-9a52-0b5b3c8a7e11
                    platform: IOS
                    device_label: iPhone de Ana
                    app_version: 1.0.0
      responses:
        '200':
          description: Sessão emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Login ou cadastro com Google
      description: |
        O servidor valida assinatura, `aud`, `iss`, expiração e `nonce` do `id_token` (ADR-0007).
        Se o e-mail verificado já pertence a uma conta com outro método, **não há fusão
        automática**: responde `409 IDENTITY_LINK_REQUIRED`; o usuário entra pelo método original
        e vincula em `POST /me/identities`. Para conta nova sem `consents`, responde `403 CONSENT_REQUIRED`.
      security: []
      x-rf: [RF-001, RF-003]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: Sessão emitida (conta existente ou criada).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/apple:
    post:
      tags: [Auth]
      operationId: loginWithApple
      summary: Login ou cadastro com Apple
      description: Mesmas regras de `/auth/google`. Nome só é enviado pela Apple no primeiro login; o cliente o repassa em `given_name`/`family_name`.
      security: []
      x-rf: [RF-001, RF-003]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialLoginRequest' }
      responses:
        '200':
          description: Sessão emitida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotacionar refresh token
      description: |
        Refresh token é de uso único. Reuso de um token já rotacionado revoga toda a família da
        sessão e responde `401 REFRESH_TOKEN_REUSED` (SEC-011). Sessão revogada responde `401 SESSION_REVOKED`;
        o cliente **não** apaga mutações pendentes (RF-001-A4).
      security: []
      x-rf: [RF-001, RF-054]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novo par de tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Encerrar a sessão atual
      description: Revoga a sessão do token usado e remove o token de push do dispositivo. Idempotente.
      x-rf: [RF-054]
      x-roles: [Any]
      responses:
        '204': { description: Sessão encerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Solicitar recuperação de senha
      description: Resposta idêntica para e-mail cadastrado ou não (RF-002-A1).
      security: []
      x-rf: [RF-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Se o e-mail existir, instruções foram enviadas.' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Definir nova senha com token de recuperação
      description: |
        Consome o token, troca a senha e encerra **todas** as sessões do usuário e **todos** os refresh tokens
        (todas as famílias), além de invalidar tokens de reautenticação em circulação e outros tokens de recuperação
        pendentes (SEC-017, SR-013.6). No reset não há sessão corrente a preservar: o cliente deve fazer login novo
        com a senha nova (a resposta `204` não emite sessão). Aviso de segurança por e-mail. Token expirado ou usado é
        recusado (RF-002-A3; `401 INVALID_RESET_TOKEN`). O token de recuperação é de uso único, aleatório (128 bits ou
        mais) e vale no máximo 30 minutos.
      security: []
      x-rf: [RF-002]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, writeOnly: true }
                new_password: { type: string, format: password, writeOnly: true }
      responses:
        '204': { description: Senha alterada. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/reauthenticate:
    post:
      tags: [Auth]
      operationId: reauthenticate
      summary: Reautenticar para operação sensível
      description: |
        Devolve `reauth_token` de curta duração (máximo 300 s), enviado no cabeçalho `X-Reauth-Token`
        em exportação, exclusão de conta/bebê, troca de e-mail/senha, vínculo de identidade e transferência de
        propriedade.

        **Escopo e uso único (SR-013.1):** o cliente informa em `scope` a(s) operação(ões) sensível(is) a que o token
        se destina (ver `ReauthScope`; cada operação sensível lista o seu em `x-reauth-scope`). O token é vinculado ao
        usuário (`sub`) e à sessão (`sid`), carrega o `scope` e um `jti` de **uso único**: depois de aceito por uma
        operação, o mesmo token é recusado (`401 REAUTH_REQUIRED`), e o cliente obtém outro por operação. Token com
        escopo diferente da operação, de outra sessão, expirado ou já usado: `401 REAUTH_REQUIRED`. Sem `scope`
        (comportamento de transição da v1), o servidor emite um token de uso único que vale para **uma** operação
        sensível qualquer do usuário nesta sessão; o cliente deve passar a enviar `scope` (será obrigatório na `/v2`).
        Credenciais: `password` ou (`provider`, `id_token`, `nonce`), exatamente um dos dois. Falhas repetidas
        sofrem limite de taxa por usuário e por IP (`429`).
      x-rf: [RF-044, RF-045]
      x-roles: [Any]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthRequest' }
      responses:
        '200':
          description: Reautenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # --------------------------------------------------------------- ACCOUNT
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Obter o usuário autenticado
      x-rf: [RF-001, RF-040]
      x-roles: [Any]
      responses:
        '200':
          description: Usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Atualizar perfil (nome, idioma, fuso)
      x-rf: [RF-050]
      x-roles: [Any]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password:
    put:
      tags: [Account]
      operationId: changePassword
      x-reauth-scope: [ACCOUNT_PASSWORD_CHANGE]
      summary: Alterar senha
      description: Exige `X-Reauth-Token` com escopo `ACCOUNT_PASSWORD_CHANGE`. Revoga as outras sessões (e seus refresh tokens) e dispara aviso de segurança (RF-002-A5). `new_password` tem no máximo 128 caracteres.
      x-rf: [RF-002]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, format: password, writeOnly: true }
      responses:
        '204': { description: Senha alterada. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/email-changes:
    post:
      tags: [Account]
      operationId: requestEmailChange
      x-reauth-scope: [ACCOUNT_EMAIL_CHANGE]
      summary: Solicitar troca de e-mail
      description: Exige `X-Reauth-Token` com escopo `ACCOUNT_EMAIL_CHANGE`. Envia código ao novo e-mail; confirmação em `/me/email-changes/confirm`. Aviso de segurança ao e-mail antigo (RF-002-A5).
      x-rf: [RF-002, RF-055]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
      responses:
        '202': { description: Código enviado (resposta uniforme). }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/email-changes/confirm:
    post:
      tags: [Account]
      operationId: confirmEmailChange
      summary: Confirmar troca de e-mail
      description: |
        Mesma política de código de `/auth/email/verify`: numérico de 6 a 12 dígitos, uso único, validade máxima de
        15 minutos, no máximo 5 tentativas por código e limite de taxa (`429`). Código inválido, expirado ou esgotado:
        `401 INVALID_VERIFICATION_CODE`. Revoga as outras sessões.
      x-rf: [RF-002]
      x-roles: [Any]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, writeOnly: true }
      responses:
        '200':
          description: E-mail alterado; as outras sessões foram revogadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/identities:
    post:
      tags: [Account]
      operationId: linkIdentity
      x-reauth-scope: [IDENTITY_LINK]
      summary: Vincular identidade Google ou Apple à conta logada
      description: Única forma de unir métodos de login sobre o mesmo e-mail (ADR-0007). Exige `X-Reauth-Token` com escopo `IDENTITY_LINK`.
      x-rf: [RF-001]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token, nonce]
              properties:
                provider: { $ref: '#/components/schemas/IdentityProvider' }
                id_token: { type: string, writeOnly: true }
                nonce: { type: string }
      responses:
        '200':
          description: Identidade vinculada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/identities/{provider}:
    delete:
      tags: [Account]
      operationId: unlinkIdentity
      x-reauth-scope: [IDENTITY_UNLINK]
      summary: Desvincular identidade
      description: Exige `X-Reauth-Token` com escopo `IDENTITY_UNLINK`. Recusa (`409 LAST_LOGIN_METHOD`) se for o único método de login.
      x-rf: [RF-001]
      x-roles: [Any]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IdentityProvider' }
        - $ref: '#/components/parameters/ReauthToken'
      responses:
        '204': { description: Desvinculada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/sessions:
    get:
      tags: [Account]
      operationId: listSessions
      summary: Listar sessões e dispositivos ativos
      description: Só as sessões do próprio usuário (RF-054-A3). A sessão atual vem com `is_current=true`.
      x-rf: [RF-054]
      x-roles: [Any]
      responses:
        '200':
          description: Sessões ativas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/{session_id}:
    delete:
      tags: [Account]
      operationId: revokeSession
      summary: Revogar uma sessão
      description: Tokens da sessão deixam de funcionar imediatamente. Revogar a atual equivale a sair (RF-054-A4).
      x-rf: [RF-054, RF-002]
      x-roles: [Any]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revogada (idempotente). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/session-revocations:
    post:
      tags: [Account]
      operationId: revokeOtherSessions
      summary: Encerrar todas as outras sessões
      description: A sessão atual permanece ativa (RF-002-A4).
      x-rf: [RF-002, RF-054]
      x-roles: [Any]
      responses:
        '200':
          description: Quantidade de sessões revogadas.
          content:
            application/json:
              schema:
                type: object
                required: [revoked_count]
                properties:
                  revoked_count: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/push-tokens/{device_id}:
    put:
      tags: [Account]
      operationId: registerPushToken
      summary: Registrar ou atualizar token de push do dispositivo (APNs/FCM)
      description: |
        Upsert por `device_id` (o mesmo informado no login). Token inválido reportado pelo provedor
        é removido pelo servidor (RF-039-A4). O conteúdo da notificação é neutro por padrão (privacy-security-spec R8).
      x-rf: [RF-037, RF-039]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRegistration' }
            examples:
              apns:
                value:
                  platform: APNS
                  token: 740f4707bebcf74f9b7c25d48e3358945f6aa01da5ddb387462c7eaf61bb78ad
                  environment: PRODUCTION
                  app_version: 1.0.0
                  locale: pt-BR
                  os_notifications_authorized: true
      responses:
        '200':
          description: Registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushToken' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      operationId: unregisterPushToken
      summary: Remover token de push do dispositivo
      x-rf: [RF-037]
      x-roles: [Any]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': { description: Removido (idempotente). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- BABIES
  /babies:
    get:
      tags: [Babies]
      operationId: listBabies
      summary: Listar bebês acessíveis ao usuário
      description: Inclui bebês em que o usuário tem vínculo `ACTIVE`, com o papel dele em `my_role`.
      x-rf: [RF-004]
      x-roles: [Owner, Caregiver, ReadOnly]
      responses:
        '200':
          description: Bebês.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Baby' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Babies]
      operationId: createBaby
      summary: Criar perfil de bebê
      description: |
        O criador vira Owner ativo. `id` pode ser gerado no cliente. Exige a declaração de
        responsável legal (`child_data_guardian`) já consentida, senão `403 CONSENT_REQUIRED`.
      x-rf: [RF-004, RF-005]
      x-roles: [Any authenticated]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BabyCreate' }
            examples:
              default:
                value:
                  display_name: Nina
                  birth_date: '2026-01-10'
                  due_date: '2026-01-24'
                  timezone: America/Sao_Paulo
      responses:
        '201':
          description: Bebê criado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baby' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReuse' }
  /babies/{baby_id}:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    get:
      tags: [Babies]
      operationId: getBaby
      summary: Obter bebê
      description: |
        Inclui idades calculadas na data local do bebê (RF-005). `age_calculation` é a fonte canônica da idade
        cronológica e corrigida em dias; a idade corrigida **nunca é persistida** (ADR-0009).
      x-rf: [RF-004, RF-005]
      x-roles: [Owner, Caregiver, ReadOnly]
      responses:
        '200':
          description: Bebê.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baby' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Babies]
      operationId: updateBaby
      summary: Editar bebê
      description: |
        **Somente o Owner** edita o perfil do bebê (ADR-0009, decisão 6); Caregiver e ReadOnly recebem
        `403 FORBIDDEN_ROLE`. Merge-patch. Alterar `birth_date`, `due_date` ou `timezone` recalcula idades e
        previsões e **não** altera eventos históricos (RB-003/014). `If-Match` com a `version` evita sobrescrita.
      x-rf: [RF-004, RF-005, RF-012]
      x-roles: [Owner]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/BabyUpdate' }
      responses:
        '200':
          description: Bebê atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baby' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Papel insuficiente (`FORBIDDEN_ROLE` para Caregiver e ReadOnly) ou vínculo revogado (`ACCESS_REVOKED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notOwner:
                  value:
                    type: https://api.nina.app/problems/forbidden-role
                    title: Only the Owner can edit the baby profile
                    status: 403
                    code: FORBIDDEN_ROLE
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Babies]
      operationId: deleteBaby
      x-reauth-scope: [BABY_DELETE]
      summary: Excluir bebê para todos os cuidadores
      description: |
        Apenas Owner, com `X-Reauth-Token` de escopo `BABY_DELETE`. Apaga eventos, previsões e preferências, gera
        tombstone de sync e invalida caches (RB-008/015). Se houver outros cuidadores ativos exige
        `acknowledge_other_caregivers=true` (aviso explícito, ADR-0008).

        **Notificação (SR-016):** com outros cuidadores ativos, o servidor notifica o Owner e **todos os cuidadores
        ativos** (e-mail e push, categoria `SYSTEM`, não desativável) ao receber o pedido e ao concluir a exclusão, e
        registra o `jti` do token de reautenticação na auditoria. O servidor não permite que a exclusão seja confirmada
        sem a prova de reautenticação. Esta operação continua **imediata** na v1; a janela de arrependimento para
        bebê compartilhado exige decisão ou `/v2` (`specs/api-spec.md`, seção 8.4).
      x-rf: [RF-045, RF-055]
      x-roles: [Owner]
      parameters:
        - $ref: '#/components/parameters/ReauthToken'
        - name: acknowledge_other_caregivers
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Excluído. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # -------------------------------------------------------------- CAREGIVERS
  /babies/{baby_id}/caregivers:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    get:
      tags: [Caregivers]
      operationId: listCaregivers
      summary: Listar cuidadores e convites pendentes
      description: Vínculos `PENDING` e `ACTIVE`. E-mail do convidado só é visível ao Owner; demais papéis veem `display_name`.
      x-rf: [RF-006]
      x-roles: [Owner, Caregiver, ReadOnly]
      responses:
        '200':
          description: Vínculos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /babies/{baby_id}/caregivers/{membership_id}:
    parameters:
      - $ref: '#/components/parameters/BabyId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Caregivers]
      operationId: updateCaregiverRole
      summary: Alterar papel de um cuidador
      description: Owner não pode rebaixar a si mesmo sem transferir a propriedade (RF-006-A7). Gera AuditEvent.
      x-rf: [RF-006, RF-055]
      x-roles: [Owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/InvitableRole' }
      responses:
        '200':
          description: Vínculo atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Caregivers]
      operationId: removeCaregiver
      summary: Remover cuidador (ou sair do bebê)
      description: |
        Owner remove qualquer não-Owner. Caregiver/ReadOnly pode remover o **próprio** vínculo (sair).
        Efeito imediato: tokens, cache e cursor do removido para o bebê são invalidados (RB-015, INV-14);
        a próxima chamada dele recebe `403 ACCESS_REVOKED`. Também cancela convite pendente.
      x-rf: [RF-006, RF-007, RF-055]
      x-roles: [Owner, "Caregiver/ReadOnly (apenas o próprio vínculo)"]
      responses:
        '204': { description: Removido. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /babies/{baby_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    post:
      tags: [Caregivers]
      operationId: createInvitation
      summary: Convidar cuidador por e-mail
      description: |
        Cria vínculo `PENDING` e envia o convite. A resposta não revela se o e-mail tem conta (SEC-051).
        Token aleatório de 128 bits ou mais, uso único, expira em 7 dias (SEC-004; D-17). Limite diário por Owner.
        Reconvite de quem já está vinculado não cria segundo vínculo (RF-006-A8): responde `409 ALREADY_MEMBER`.
      x-rf: [RF-006, RF-055]
      x-roles: [Owner]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
            examples:
              default: { value: { email: avo@example.org, role: CAREGIVER } }
      responses:
        '201':
          description: Convite criado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReuse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /babies/{baby_id}/invitations/{membership_id}/resend:
    parameters:
      - $ref: '#/components/parameters/BabyId'
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [Caregivers]
      operationId: resendInvitation
      summary: Reenviar convite pendente
      description: Gera novo token e invalida o anterior; renova a expiração.
      x-rf: [RF-006]
      x-roles: [Owner]
      responses:
        '200':
          description: Convite reenviado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /babies/{baby_id}/ownership-transfer:
    parameters:
      - $ref: '#/components/parameters/BabyId'
    post:
      tags: [Caregivers]
      operationId: transferOwnership
      x-reauth-scope: [OWNERSHIP_TRANSFER]
      summary: Transferir a propriedade do bebê
      description: Exige `X-Reauth-Token` com escopo `OWNERSHIP_TRANSFER` e destino com vínculo `ACTIVE`. O Owner anterior vira Caregiver. Gera AuditEvent e notifica o novo e o antigo Owner.
      x-rf: [RF-006, RF-045, RF-055]
      x-roles: [Owner]
      parameters:
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_membership_id]
              properties:
                new_owner_membership_id: { type: string, format: uuid }
      responses:
        '200':
          description: Propriedade transferida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Baby' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invitations/inspect:
    post:
      tags: [Caregivers]
      operationId: inspectInvitation
      summary: Ver prévia do convite recebido
      description: |
        Autenticado como convidado. Mostra convidante, papel e rótulo reduzido do bebê (sem nome completo
        antes do aceite, UX 4.7). Token inválido, expirado ou de outro e-mail: `404` uniforme.
        POST evita o token em URL/log.
      x-rf: [RF-006]
      x-roles: [Invitee]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: Prévia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /invitations/accept:
    post:
      tags: [Caregivers]
      operationId: acceptInvitation
      summary: Aceitar convite
      description: |
        Vínculo vira `ACTIVE` com o papel atribuído. O convidado precisa ter aceito os Termos na própria
        conta (senão `403 CONSENT_REQUIRED`). Em seguida o app faz o pull inicial (RF-007-A4).
      x-rf: [RF-006, RF-007]
      x-roles: [Invitee]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: Aceito.
          content:
            application/json:
