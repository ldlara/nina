  /me/consents:
    get:
      tags: [Privacy]
      operationId: listConsents
      summary: Consultar consentimentos
      description: |
        Estado corrente por finalidade, mais `pending_required` (documentos com nova versão exigindo novo aceite, RF-003-A2).
        Com `include_history=true`, devolve também o histórico append-only (INV-27). O servidor é a fonte da verdade.
      x-rf: [RF-003, RF-040]
      x-roles: [Any]
