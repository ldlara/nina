# Ambiente local de desenvolvimento. Segredos vêm de .env (não versionado); veja .env.example.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nina
      POSTGRES_USER: ${POSTGRES_USER:-nina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nina} -d nina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.dev }
    working_dir: /src/backend/src/Nina.Api
    command: dotnet watch run --urls http://0.0.0.0:8080
    environment:
      ConnectionStrings__Default: Host=postgres;Database=nina;Username=${POSTGRES_USER:-nina};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
    volumes: [".:/src"]
    ports: ["5080:8080"]
    depends_on: { postgres: { condition: service_healthy } }

  bff:
    build: { context: ., dockerfile: infra/docker/Dockerfile.dev }
    working_dir: /src/backend/src/Nina.Bff
    command: dotnet watch run --urls http://0.0.0.0:8080
    environment:
      Api__BaseUrl: http://api:8080
      ASPNETCORE_ENVIRONMENT: Development
    volumes: [".:/src"]
    ports: ["5081:8080"]
    depends_on: [api]

  # Ferramentas one-shot: docker compose run --rm dotnet dotnet --info
  dotnet:
    build: { context: ., dockerfile: infra/docker/Dockerfile.dev }
    working_dir: /src/backend
    volumes: [".:/src"]
    profiles: [tools]

volumes:
  pgdata:
