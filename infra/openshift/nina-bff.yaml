apiVersion: apps/v1
kind: Deployment
metadata:
  name: nina-bff
  labels: { app: nina-bff, app.kubernetes.io/part-of: nina }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nina-bff }
  template:
    metadata:
      labels: { app: nina-bff, app.kubernetes.io/part-of: nina }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bff
          image: REGISTRY/nina-bff@sha256:DIGEST  # placeholder: registry (ADR-0006); implantar por digest (SR-017)
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: nina-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 500m, memory: 384Mi, ephemeral-storage: 256Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nina-bff
  labels: { app: nina-bff, app.kubernetes.io/part-of: nina }
spec:
  selector: { app: nina-bff }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nina-bff
  labels: { app: nina-bff, app.kubernetes.io/part-of: nina }
  annotations:
    # HSTS (aplicado pelo router em rotas edge/reencrypt)
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains
    # Rate limit por IP de origem (valores iniciais; ajustar após teste de carga)
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "50"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "200"
    haproxy.router.openshift.io/timeout: 30s
    # Somente HTTP/HTTPS pelo router; sem balanceamento "sticky" por cookie desnecessário
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  # host: definir por ambiente (dominio pendente)
  to: { kind: Service, name: nina-bff }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
