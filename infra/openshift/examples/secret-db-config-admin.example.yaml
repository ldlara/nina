# MOLDE: sem valores reais. Um Secret por papel de banco (menor privilégio; rotação independente).
# Crie o real via gestor de segredos (Vault/External Secrets) ou `oc create secret` a partir de arquivo/STDIN,
# nunca com --from-literal (fica no histórico do shell). Papel: nina_config_admin (config).
apiVersion: v1
kind: Secret
metadata:
  name: nina-db-config-admin
  labels: { app.kubernetes.io/part-of: nina }
type: Opaque
stringData:
  # Host=<host>;Database=nina;Username=nina_config_admin;Password=<senha>;SSL Mode=VerifyFull
  ConnectionStrings__Default: ""
