org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Configuração do app (SEM valores reais; sobrescreva em ~/.gradle/gradle.properties ou -P) ---
# URL base da API do BFF, com /v1 e barra final. Placeholder em TLD reservado (.invalid nunca resolve).
nina.apiBaseUrl=https://api.nina.invalid/v1/
# Client ID OAuth "web" do Google (usado só quando o provedor real for implementado). Vazio = não configurado.
nina.googleWebClientId=
