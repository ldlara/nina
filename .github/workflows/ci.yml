name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Nina.sln
      - name: Format (verify)
        run: dotnet format Nina.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Nina.sln -c Release --no-restore
      - name: Test
        run: dotnet test Nina.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Vulnerability scan (falha se houver pacote vulneravel)
        run: |
          dotnet list Nina.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "^\s+>" vuln.txt; then echo "Pacotes vulneraveis encontrados"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/**/TestResults/*.trx
