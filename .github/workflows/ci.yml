name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mínimo por padrão; jobs que precisam de mais declaram o próprio bloco (SR-017).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ações fixadas por SHA de commit (comentário = tag resolvida via git ls-remote em 2026-10-08).
# Atualização: Dependabot (github-actions) ou revisão manual do diff do SHA.
#   actions/checkout        v6.0.2 -> de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/setup-dotnet    v5.4.0 -> 26b0ec14cb23fa6904739307f278c14f94c95bf1
#   actions/upload-artifact v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   github/codeql-action    v4.38.2 -> 2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
#   aquasecurity/trivy-action v0.36.0 -> ed142fd0673e97e23eac54620cfb913e5ce36c25
#   anchore/sbom-action     v0.24.3 -> 66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Nina.sln
      - name: Format (verify)
        run: dotnet format Nina.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Nina.sln -c Release --no-restore
      - name: Test
        run: dotnet test Nina.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Vulnerability scan (falha se houver pacote vulneravel)
        run: |
          dotnet list Nina.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "^\s+>" vuln.txt; then echo "Pacotes vulneraveis encontrados"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: backend/**/TestResults/*.trx

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz (checksums.txt oficial do release v8.30.1).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # histórico completo: segredos já removidos do HEAD continuam no git log
          persist-credentials: false
      - name: Install gitleaks (CLI, checksum verificado)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$RUNNER_TEMP/gitleaks"
      - name: Scan (histórico completo; falha se achar segredo)
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .'

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: backend/global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build (para o extractor)
        run: dotnet build backend/Nina.sln -c Release
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:csharp"

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: SBOM (CycloneDX) do código-fonte/dependências
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json
          artifact-name: sbom-backend.cdx.json
          upload-release-assets: false

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Nina.Api
            image: nina-api
          - project: Nina.Bff
            image: nina-bff
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build (sem push)
        run: >
          docker build -f infra/docker/Dockerfile.service
          --build-arg PROJECT=${{ matrix.project }}
          -t nina-ci/${{ matrix.image }}:${{ github.sha }} .
      - name: Trivy (vulnerabilidades HIGH/CRITICAL corrigíveis falham o job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nina-ci/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM da imagem (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: nina-ci/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.project }}-image.cdx.json
          artifact-name: sbom-${{ matrix.project }}-image.cdx.json
          upload-release-assets: false
